name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Determinate Nix (the upstream-Nix install path was removed
      # 2026-01-01 — this action no longer offers it). KVM is auto-enabled
      # because this repo is public, which is what lets the seed nixosTest
      # leg below boot a real VM on a standard runner (D-13).
      - uses: DeterminateSystems/nix-installer-action@v22
      # -L streams the nixosTest VM's console output; without it a failing
      # boot test is just "exit 1" with no way to diagnose it.
      - run: nix flake check -L
      - run: nix develop --command node scripts/drift-gate.mjs

  windows-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # No Rust setup action — the common toolchain-setup actions do not read
      # the repo's toolchain pin file and would silently install a different
      # version (the exact failure mode the drift gate exists to catch). Bare
      # rustup, preinstalled on windows-latest, auto-resolves the pin on
      # first invocation.
      - run: rustup show
      - run: npm ci
      # Positioned after both toolchains resolve, before the expensive
      # build, so drift fails fast.
      - run: node scripts/drift-gate.mjs
      - run: npx vitest run
      - run: npm run verify:fonts
      - run: npm run tauri build

  # D-03: until Phase 11 builds the real update channel, pushing the built
  # closure to the Attic cache IS the publish step for this project. `needs:`
  # below is what makes "a red CI run blocks any publish" (FOUND-02) literally
  # true rather than a policy statement — if a future check is added to this
  # workflow, add it to this list too.
  publish:
    needs: [nix-checks, windows-tauri]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # The closure itself, not the tarball builder — the tarball builder
      # needs root to run, and its inputs are already inside this closure.
      - run: nix build .#substrate-system
      # Plan 05 minted and stored this push-scoped token as the repository
      # secret ATTIC_TOKEN (not ATTIC_PUSH_TOKEN, which this plan's own
      # drafting assumed before the cache existed) — see this plan's SUMMARY,
      # Deviations, for the correction.
      #
      # attic-client is pinned to the exact nixpkgs revision that built the
      # deployed server (Deocracy/nixos-hosting's flake.lock nixpkgs input)
      # rather than resolved via the floating `nixpkgs` flake registry entry —
      # cheap protocol-drift insurance for a crate that is explicitly WIP
      # upstream, kept even though it did not turn out to be this job's actual
      # failure (see docs/CACHE-RUNBOOK.md's WIP caveat).
      #
      # THE REAL BUG (diagnosed, fixed, not yet deployed — see
      # docs/CACHE-RUNBOOK.md "Known gap: push fails with HTTP 405"): atticd's
      # `settings.api-endpoint` is unset on ohio1, so it naively synthesizes
      # its own public API URL from the request it receives — which arrives
      # over plain HTTP on the nginx↔atticd loopback leg, not the HTTPS the
      # real client used. `attic push` follows that delegated http:// URL,
      # Cloudflare 301-redirects it to https, and reqwest downgrades the
      # follow-up POST/PUT to GET on the redirect — landing on the right path
      # with the wrong method, which every route answers with a bare 405.
      # Fix is parked on `Deocracy/nixos-hosting`'s `fix/attic-api-endpoint`
      # branch (not merged — merging auto-deploys within 30 min); this job
      # will keep failing at the push step until that branch is merged and
      # `ohio1` is rebuilt.
      - run: |
          ATTIC="github:NixOS/nixpkgs/b6018f87da91d19d0ab4cf979885689b469cdd41#attic-client"
          nix run "$ATTIC" -- login sourcerer https://sourcerer-cache.deocracy.org "$ATTIC_TOKEN"
          nix run "$ATTIC" -- push sourcerer ./result
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
