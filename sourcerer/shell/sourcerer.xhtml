<!--
  D-89/D-91/D-94: the entire startup window. No custom browser chrome --
  no tab strip, toolbar, address bar, or menu. One branded loading layer
  (chrome-rendered, no network, no sidecar) painted above one remote
  <browser> element waiting for a URL. Theia's own shell is the UI.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      windowtype="sourcerer:main"
      scrolling="false"
      >
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:"/>
    <title>Sourcerer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
      }
      #sourcerer-loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8e8e8;
        font-family: sans-serif;
        font-size: 1.5em;
        background: #1a1a1a;
      }
      #sourcerer-content {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
    <script src="chrome://sourcerer/content/sourcerer.js"></script>
  </head>
  <body>
    <div id="sourcerer-loading">Sourcerer</div>
    <xul:browser id="sourcerer-content" type="content" primary="true" remote="true" remoteType="web" tabindex="-1"/>
  </body>
</html>
