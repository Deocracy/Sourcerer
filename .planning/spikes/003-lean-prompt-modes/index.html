<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spike 003 — lean prompt modes</title>
<style>
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; background: #111; color: #ddd; font: 14px "IBM Plex Mono", Consolas, monospace; display: flex; flex-direction: column; height: 100vh; }
  #bar { padding: 8px 12px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #gauge { color: #8a8; }
  label { cursor: pointer; user-select: none; }
  label input { accent-color: #2a4; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin: 8px 0; padding: 8px 10px; max-width: 80%; white-space: pre-wrap; }
  .user { background: #223; border: 1px solid #446; margin-left: auto; }
  .bot  { background: #1c1c1c; border: 1px solid #333; }
  .tool { color: #fa5; font-size: 12px; margin: 4px 0; }
  .sys  { color: #6af; font-size: 12px; margin: 4px 0; }
  .err  { color: #f66; }
  #form { display: flex; border-top: 1px solid #333; }
  #inp { flex: 1; background: #181818; color: #ddd; border: 0; padding: 12px; font: inherit; outline: none; }
  button { background: #2a4; color: #000; border: 0; padding: 0 20px; font: inherit; cursor: pointer; }
  button:disabled { background: #444; }
</style>
</head>
<body>
<div id="bar"><span id="modes"></span><span id="gauge"></span></div>
<div id="chat"></div>
<form id="form"><input id="inp" placeholder="Try: what's in my wiki about Deocracy? (needs Research mode on)" autocomplete="off"><button id="send">Send</button></form>
<script>
const chat = document.getElementById("chat"), inp = document.getElementById("inp"),
      form = document.getElementById("form"), send = document.getElementById("send"),
      modesEl = document.getElementById("modes"), gauge = document.getElementById("gauge");
let botDiv = null, state = null;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function refresh() {
  state = await (await fetch("/state")).json();
  modesEl.innerHTML = "";
  for (const [k, m] of Object.entries(state.modes)) {
    const l = document.createElement("label");
    const c = document.createElement("input");
    c.type = "checkbox"; c.checked = m.on;
    c.onchange = async () => {
      const activeKeys = [...modesEl.querySelectorAll("input")].filter(i => i.checked).map(i => i.dataset.k);
      const r = await (await fetch("/modes", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({ active: activeKeys }) })).json();
      add("sys", `modes → [${r.active.join(", ")}] | tools: ${r.tools.join(", ") || "(none)"} | prompt ~${r.tokensApprox} tokens`);
      refresh();
    };
    c.dataset.k = k;
    l.appendChild(c); l.appendChild(document.createTextNode(" " + m.label + " "));
    modesEl.appendChild(l);
  }
  gauge.textContent = `prompt: ${state.prompt.chars} chars (~${state.prompt.tokensApprox} tokens) | tools: ${state.activeTools.length}`;
}
refresh();

const es = new EventSource("/events");
es.onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.type === "text_delta") { if (!botDiv) botDiv = add("bot", ""); botDiv.textContent += e.delta; chat.scrollTop = chat.scrollHeight; }
  else if (e.type === "tool_start") { add("tool", "⚙ " + e.tool); botDiv = null; }
  else if (e.type === "tool_end") add("tool", (e.isError ? "✗ " : "✓ ") + e.tool);
  else if (e.type === "error") add("bot err", "ERROR: " + e.message);
  else if (e.type === "done") { botDiv = null; send.disabled = false; inp.focus(); refresh(); }
};

form.onsubmit = (ev) => {
  ev.preventDefault();
  const message = inp.value.trim();
  if (!message) return;
  add("user", message); inp.value = ""; send.disabled = true;
  fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message }) });
};
</script>
</body>
</html>
