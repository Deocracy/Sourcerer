<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 004 — Corpus Workspace</title>
<link rel="stylesheet" href="../themes/default.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #060607; }
  body { font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-fg); padding-top: 44px; }

  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #060607; border-bottom: 1px solid var(--color-line); padding: 8px 16px; display: flex; gap: 8px; }
  .variant-tab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; background: transparent; color: var(--color-dim); border: 1px solid var(--color-line); padding: 6px 14px; cursor: pointer; transition: all .15s ease; }
  .variant-tab:hover { color: var(--color-fg); border-color: var(--color-dim-hover); }
  .variant-tab.active { color: var(--color-accent); border-color: var(--color-accent); }
  .variant { display: none; } .variant.active { display: block; }

  .window { max-width: 1240px; margin: 20px auto; background: var(--color-bg); border: var(--window-border); border-radius: var(--window-radius); overflow: hidden; min-height: 700px; display: flex; flex-direction: column; }
  .titlebar { height: var(--titlebar-h); border-bottom: 1px solid var(--color-line); display: flex; align-items: center; padding-left: var(--titlebar-inset); gap: var(--cluster-gap); flex: 0 0 auto; }
  .logo { width: var(--logo-circle); height: var(--logo-circle); border: var(--logo-stroke) solid var(--color-fg); border-radius: 50%; position: relative; flex: 0 0 auto; }
  .logo::after { content: ""; width: var(--logo-dot); height: var(--logo-dot); background: var(--color-fg); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .wordmark { font-family: var(--font-mono); font-size: var(--fs-display); letter-spacing: var(--ls-wordmark); }
  .crumb-dot { color: var(--color-dim); }
  .crumb { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--color-dim); }
  .winctl { margin-left: auto; display: flex; }
  .winctl span { width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--color-dim); font-family: var(--font-mono); font-size: 12px; }

  .seclabel { font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--ls-label-wide); text-transform: uppercase; color: var(--color-faint); }
  .chip { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--color-line-2); color: var(--color-muted); padding: 2px 7px; }
  .chip.accent { color: var(--color-accent); border-color: rgba(134,163,140,.45); }
  .chip.warn { color: #C9A227; border-color: rgba(201,162,39,.4); }
  .chip.err { color: #C42B1C; border-color: rgba(196,43,28,.4); }
  button.ghost { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: 1px solid var(--color-line-2); color: var(--color-fg-secondary); padding: 5px 10px; cursor: pointer; transition: all .15s ease; }
  button.ghost:hover { border-color: var(--color-dim-hover); color: var(--color-fg); }

  /* ---- shared section content styles ---- */
  .content { flex: 1; overflow: auto; padding: var(--space-lg) var(--space-xl); }
  .content h2 { font-family: var(--font-serif); font-size: 22px; font-weight: var(--fw-regular); margin-bottom: 4px; }
  .content .meta { font-family: var(--font-mono); font-size: 10px; color: var(--color-faint); margin-bottom: var(--space-md); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-faint); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-line-2); font-weight: var(--fw-regular); }
  .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--color-line); color: var(--color-fg-secondary); }
  .tbl tr:hover td { background: var(--color-panel); }
  .qmodes { display: flex; gap: 6px; margin: 10px 0; }
  .qmode { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--color-line-2); color: var(--color-dim); cursor: pointer; transition: all .12s ease; }
  .qmode:hover { color: var(--color-fg); }
  .qmode.on { color: var(--color-accent); border-color: rgba(134,163,140,.45); }
  .qinput { width: 100%; background: var(--color-panel-2); border: 1px solid var(--color-line-2); color: var(--color-fg); font-family: var(--font-sans); font-size: 13px; padding: 10px 12px; outline: none; }
  .qinput:focus { border-color: var(--color-dim-hover); }
  .qresult { border: 1px solid var(--color-line); background: var(--color-panel-2); padding: var(--space-md); margin-top: var(--space-md); font-size: 12.5px; color: var(--color-fg-secondary); display: none; }
  .graphbox { border: 1px solid var(--color-line); background: var(--color-panel-2); margin-top: 4px; }
  .gnode { cursor: pointer; }
  .gnode circle { fill: var(--color-panel); stroke: var(--color-dim); stroke-width: 1; transition: all .15s ease; }
  .gnode:hover circle { stroke: var(--color-accent); fill: #17211a; }
  .gnode text { fill: var(--color-fg-secondary); font-family: var(--font-mono); font-size: 9px; }
  .wikimini p { font-family: var(--font-serif); font-size: 15px; line-height: 1.7; color: var(--color-fg-secondary); max-width: 620px; margin-bottom: var(--space-md); }
  .cl { border-bottom: 1px dotted var(--color-dim); cursor: pointer; }
  .cl:hover { border-bottom-color: var(--color-accent); color: #fff; }
  .cl.disp { border-bottom: 1px dashed #C9A227; color: #d9c98a; }

  /* ============ A: icon rail ============ */
  .a-body { flex: 1; display: flex; min-height: 0; }
  .a-rail { width: 168px; border-right: 1px solid var(--color-line); background: var(--color-panel-2); padding: var(--space-sm) 0; flex: 0 0 auto; }
  .a-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; color: var(--color-dim); border-left: 2px solid transparent; transition: all .12s ease; font-size: 12.5px; }
  .a-item:hover { color: var(--color-fg); background: var(--color-panel); }
  .a-item.on { color: var(--color-fg); background: var(--color-panel); border-left-color: var(--color-accent); }
  .a-item .ic { font-family: var(--font-mono); font-size: 12px; width: 16px; text-align: center; }
  .a-item .n { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: #C9A227; }
  .a-sep { border-top: 1px solid var(--color-line); margin: 8px 0; }

  /* ============ B: top tabs ============ */
  .b-tabs { height: 34px; border-bottom: 1px solid var(--color-line); background: var(--color-panel-2); display: flex; align-items: stretch; flex: 0 0 auto; }
  .b-tab { display: flex; align-items: center; gap: 7px; padding: 0 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; color: var(--color-dim); border-right: 1px solid var(--color-line); cursor: pointer; transition: all .12s ease; }
  .b-tab:hover { color: var(--color-fg-secondary); }
  .b-tab.on { color: var(--color-fg); background: var(--color-bg); box-shadow: inset 0 2px 0 var(--color-accent); }
  .b-tab .n { font-family: var(--font-mono); font-size: 9px; color: #C9A227; }

  /* ============ C: wiki-first + drawer ============ */
  .c-body { flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden; }
  .c-main { flex: 1; overflow: auto; }
  .c-toolbtn { position: absolute; top: 12px; right: 12px; z-index: 20; }
  .drawer { position: absolute; top: 0; right: -420px; width: 420px; bottom: 0; background: var(--color-panel-2); border-left: 1px solid var(--color-line-2); box-shadow: -18px 0 44px rgba(0,0,0,.5); transition: right .22s ease; z-index: 15; display: flex; flex-direction: column; }
  .drawer.open { right: 0; }
  .d-tabs { display: flex; border-bottom: 1px solid var(--color-line); flex: 0 0 auto; }
  .d-tab { flex: 1; text-align: center; padding: 10px 0; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-dim); cursor: pointer; transition: all .12s ease; }
  .d-tab:hover { color: var(--color-fg); }
  .d-tab.on { color: var(--color-accent); box-shadow: inset 0 -2px 0 var(--color-accent); }
  .d-body { flex: 1; overflow: auto; padding: var(--space-md); }

  #toast { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--color-panel); border: 1px solid var(--color-accent); color: var(--color-fg); font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; padding: 10px 20px; opacity: 0; transition: all .2s ease; z-index: 10000; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" onclick="showVariant('a', this)">A: Section Rail ★ Selected</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B: Top Tabs</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C: Wiki-First + Tools Drawer</button>
</div>

<!-- ============ VARIANT A ============ -->
<div id="variant-a" class="variant active">
  <div class="window">
    <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">RMS Titanic</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
    <div class="a-body">
      <div class="a-rail">
        <div class="seclabel" style="padding: 6px 14px;">Corpus</div>
        <div class="a-item on" data-s="wiki" onclick="aGo(this)"><span class="ic">¶</span>Wiki</div>
        <div class="a-item" data-s="docs" onclick="aGo(this)"><span class="ic">≡</span>Documents</div>
        <div class="a-item" data-s="graph" onclick="aGo(this)"><span class="ic">◈</span>Graph</div>
        <div class="a-item" data-s="query" onclick="aGo(this)"><span class="ic">?</span>Query</div>
        <div class="a-sep"></div>
        <div class="seclabel" style="padding: 6px 14px;">Curation</div>
        <div class="a-item" data-s="queue" onclick="aGo(this)"><span class="ic">⚑</span>Queue<span class="n">3</span></div>
        <div class="a-item" data-s="history" onclick="aGo(this)"><span class="ic">↺</span>History</div>
        <div class="a-sep"></div>
        <div class="a-item" onclick="toast('Corpus settings — sketch 006')"><span class="ic">⚙</span>Settings</div>
      </div>
      <div class="content" id="a-content"></div>
    </div>
  </div>
</div>

<!-- ============ VARIANT B ============ -->
<div id="variant-b" class="variant">
  <div class="window">
    <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">RMS Titanic</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
    <div class="b-tabs">
      <div class="b-tab on" data-s="wiki" onclick="bGo(this)">Wiki</div>
      <div class="b-tab" data-s="docs" onclick="bGo(this)">Documents</div>
      <div class="b-tab" data-s="graph" onclick="bGo(this)">Graph</div>
      <div class="b-tab" data-s="query" onclick="bGo(this)">Query</div>
      <div class="b-tab" data-s="queue" onclick="bGo(this)">Queue <span class="n">3</span></div>
      <div class="b-tab" data-s="history" onclick="bGo(this)">History</div>
      <div class="b-tab" style="margin-left:auto;border-right:none;border-left:1px solid var(--color-line);" onclick="toast('Corpus settings — sketch 006')">⚙</div>
    </div>
    <div class="content" id="b-content"></div>
  </div>
</div>

<!-- ============ VARIANT C ============ -->
<div id="variant-c" class="variant">
  <div class="window">
    <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">RMS Titanic</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
    <div class="c-body">
      <div class="c-main"><div class="content" id="c-content"></div></div>
      <button class="ghost c-toolbtn" onclick="document.getElementById('drawer').classList.toggle('open')">⚒ Tools</button>
      <div class="drawer" id="drawer">
        <div class="d-tabs">
          <div class="d-tab on" data-s="docs" onclick="dGo(this)">Documents</div>
          <div class="d-tab" data-s="graph" onclick="dGo(this)">Graph</div>
          <div class="d-tab" data-s="query" onclick="dGo(this)">Query</div>
          <div class="d-tab" data-s="queue" onclick="dGo(this)">Queue</div>
        </div>
        <div class="d-body" id="d-body"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.7);color:white;padding:8px 12px;border-radius:8px;opacity:0.4;transition:opacity 0.2s;display:flex;gap:8px;align-items:center;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.4'">
  <span>004 workspace</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'" style="background:#222;color:#fff;border:1px solid #444;font-size:11px;"><option value="default">default</option></select>
</div>

<script>
function showVariant(id, btn) {
  document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).classList.add('active');
  btn.classList.add('active');
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---- shared section renderers (the LightRAG components, reskinned) ---- */
const SEC = {
  wiki: () => `
    <h2>RMS Titanic</h2><div class="meta">wiki · 318 canonical claims · head v14 · <span style="color:#C9A227">2 unresolved</span></div>
    <div class="wikimini">
      <p>RMS Titanic was a British ocean liner operated by the <span class="cl" onclick="toast('Claim inspector opens (sketch 003 synthesis)')">White Star Line</span>. She departed Southampton on <span class="cl" onclick="toast('Claim inspector opens')">10 April 1912</span> with <span class="cl" onclick="toast('Claim inspector opens')">2,435 passengers and 892 crew</span> aboard.</p>
      <p>She carried <span class="cl disp" onclick="toast('Disputed — review in queue')">20 lifeboats — capacity 1,178</span>; her <span class="cl disp" onclick="toast('Disputed — review in queue')">departure time is disputed</span>.</p>
    </div>`,
  docs: () => `
    <h2>Documents</h2><div class="meta">42 ingested · append-only originals · <button class="ghost" onclick="toast('Upload → ingest pipeline (chunks → facts → graph)')">+ Ingest document</button></div>
    <table class="tbl">
      <tr><th>Document</th><th>Status</th><th>Chunks</th><th>Facts</th><th>Ingested</th></tr>
      <tr onclick="toast('Opens doc detail: chunks + extracted facts')"><td>Board of Trade report.pdf</td><td><span class="chip accent">processed</span></td><td>214</td><td>1,102</td><td>Jul 12</td></tr>
      <tr onclick="toast('Opens doc detail')"><td>Inquiry transcript, Day 4.pdf</td><td><span class="chip accent">processed</span></td><td>96</td><td>488</td><td>Jul 14</td></tr>
      <tr onclick="toast('Pipeline status panel opens')"><td>Harland &amp; Wolff logbook.docx</td><td><span class="chip warn">processing</span></td><td>31/58</td><td>—</td><td>now</td></tr>
      <tr onclick="toast('Error detail: parse failure page 3')"><td>Deck plans (scan).pdf</td><td><span class="chip err">failed</span></td><td>—</td><td>—</td><td>Jul 13</td></tr>
    </table>`,
  graph: () => `
    <h2>Knowledge Graph</h2><div class="meta">1,204 entities · 3,911 relations · head v14 · click a node</div>
    <div class="graphbox"><svg viewBox="0 0 640 300" width="100%" height="300">
      <line x1="320" y1="150" x2="160" y2="70" stroke="#26272B"/><line x1="320" y1="150" x2="480" y2="80" stroke="#26272B"/>
      <line x1="320" y1="150" x2="180" y2="230" stroke="#26272B"/><line x1="320" y1="150" x2="500" y2="220" stroke="#26272B"/>
      <line x1="480" y1="80" x2="500" y2="220" stroke="#26272B"/>
      <g class="gnode" onclick="toast('Node panel: RMS Titanic — “View article” opens the wiki (sketch 003)')"><circle cx="320" cy="150" r="26"/><text x="320" y="153" text-anchor="middle">Titanic</text></g>
      <g class="gnode" onclick="toast('Node panel: White Star Line')"><circle cx="160" cy="70" r="20"/><text x="160" y="73" text-anchor="middle">W. Star</text></g>
      <g class="gnode" onclick="toast('Node panel: Southampton')"><circle cx="480" cy="80" r="20"/><text x="480" y="83" text-anchor="middle">S'hampton</text></g>
      <g class="gnode" onclick="toast('Node panel: Harland & Wolff')"><circle cx="180" cy="230" r="20"/><text x="180" y="233" text-anchor="middle">H&amp;W</text></g>
      <g class="gnode" onclick="toast('Node panel: 1912 voyage')"><circle cx="500" cy="220" r="20"/><text x="500" y="223" text-anchor="middle">Voyage</text></g>
    </svg></div>`,
  query: () => `
    <h2>Query</h2><div class="meta">retrieval testing — 5 modes over the versioned store</div>
    <div class="qmodes">
      ${['naive','local','global','hybrid','mix'].map((m,i) => `<span class="qmode${i===3?' on':''}" onclick="this.parentNode.querySelectorAll('.qmode').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${m}</span>`).join('')}
    </div>
    <input class="qinput" placeholder="Why were there too few lifeboats?" onkeydown="if(event.key==='Enter'){this.nextElementSibling.style.display='block';}">
    <div class="qresult"><b style="color:var(--color-fg)">Answer (hybrid):</b> Board of Trade rules dated to 1894 tied lifeboat count to tonnage, not persons aboard — Titanic exceeded the scale's maximum… <span class="chip" style="margin-left:6px" onclick="toast('Source chunks open, spans highlighted')">4 chunks</span></div>`,
  queue: () => `
    <h2>Contradiction Queue</h2><div class="meta">3 pending · surfaced, never silently unified</div>
    <table class="tbl">
      <tr><th>Attribute</th><th>Value A</th><th>Value B</th><th></th></tr>
      <tr><td>Departure time</td><td>“shortly after noon”</td><td>“12:15 pm”</td><td><button class="ghost" onclick="toast('Resolve: preview-then-apply gate (GateDialog)')">Resolve</button> <button class="ghost" onclick="toast('Dismiss with provenance audit')">Dismiss</button></td></tr>
      <tr><td>Boat capacity</td><td>1,178</td><td>1,167</td><td><button class="ghost" onclick="toast('Resolve: preview-then-apply gate')">Resolve</button> <button class="ghost" onclick="toast('Dismiss with provenance audit')">Dismiss</button></td></tr>
      <tr><td>Crew count</td><td>892</td><td>885</td><td><button class="ghost" onclick="toast('Resolve: preview-then-apply gate')">Resolve</button> <button class="ghost" onclick="toast('Dismiss with provenance audit')">Dismiss</button></td></tr>
    </table>`,
  history: () => `
    <h2>History</h2><div class="meta">linear timeline · branch / diff / revert secondary</div>
    <table class="tbl">
      <tr><th>When</th><th>Actor</th><th>Action</th><th></th></tr>
      <tr><td>2h ago</td><td><span class="chip accent">human</span></td><td>Edit “lifeboat capacity” — back-prop touched 3 targets</td><td><button class="ghost" onclick="toast('Non-destructive revert: recorded inverse applies')">Revert</button></td></tr>
      <tr><td>2h ago</td><td><span class="chip">detector</span></td><td>Contradiction surfaced: departure time</td><td></td></tr>
      <tr><td>yesterday</td><td><span class="chip">agent</span></td><td>Ingested “Inquiry transcript, Day 4.pdf” — 12 facts</td><td><button class="ghost" onclick="toast('Diff v13 → v14 opens')">Diff</button></td></tr>
    </table>`,
};

function aGo(el) { el.closest('.a-rail').querySelectorAll('.a-item').forEach(i => i.classList.remove('on')); el.classList.add('on'); document.getElementById('a-content').innerHTML = SEC[el.dataset.s](); }
function bGo(el) { el.closest('.b-tabs').querySelectorAll('.b-tab').forEach(i => i.classList.remove('on')); el.classList.add('on'); document.getElementById('b-content').innerHTML = SEC[el.dataset.s](); }
function dGo(el) { el.closest('.d-tabs').querySelectorAll('.d-tab').forEach(i => i.classList.remove('on')); el.classList.add('on'); document.getElementById('d-body').innerHTML = SEC[el.dataset.s](); }

document.getElementById('a-content').innerHTML = SEC.wiki();
document.getElementById('b-content').innerHTML = SEC.wiki();
document.getElementById('c-content').innerHTML = SEC.wiki();
document.getElementById('d-body').innerHTML = SEC.docs();
</script>
</body>
</html>
