<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 002 — Side-by-Side Corpora</title>
<link rel="stylesheet" href="../themes/default.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #060607; }
  body { font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-fg); padding-top: 44px; }

  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #060607; border-bottom: 1px solid var(--color-line); padding: 8px 16px; display: flex; gap: 8px; }
  .variant-tab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; background: transparent; color: var(--color-dim); border: 1px solid var(--color-line); padding: 6px 14px; cursor: pointer; transition: all .15s ease; }
  .variant-tab:hover { color: var(--color-fg); border-color: var(--color-dim-hover); }
  .variant-tab.active { color: var(--color-accent); border-color: var(--color-accent); }
  .variant { display: none; } .variant.active { display: block; }

  .window { max-width: 1240px; margin: 20px auto; background: var(--color-bg); border: var(--window-border); border-radius: var(--window-radius); overflow: hidden; min-height: 660px; display: flex; flex-direction: column; }
  .titlebar { height: var(--titlebar-h); border-bottom: 1px solid var(--color-line); display: flex; align-items: center; padding-left: var(--titlebar-inset); gap: var(--cluster-gap); flex: 0 0 auto; }
  .logo { width: var(--logo-circle); height: var(--logo-circle); border: var(--logo-stroke) solid var(--color-fg); border-radius: 50%; position: relative; flex: 0 0 auto; }
  .logo::after { content: ""; width: var(--logo-dot); height: var(--logo-dot); background: var(--color-fg); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .wordmark { font-family: var(--font-mono); font-size: var(--fs-display); letter-spacing: var(--ls-wordmark); }
  .crumb-dot { color: var(--color-dim); }
  .crumb { font-family: var(--font-mono); font-size: var(--fs-label); color: var(--color-dim); }
  .winctl { margin-left: auto; display: flex; }
  .winctl span { width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--color-dim); font-family: var(--font-mono); font-size: 12px; }

  .seclabel { font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: var(--ls-label-wide); text-transform: uppercase; color: var(--color-faint); }
  .chip { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--color-line-2); color: var(--color-muted); padding: 2px 7px; }
  .chip.warn { color: #C9A227; border-color: rgba(201,162,39,.4); }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .dot.on { background: var(--color-accent); box-shadow: 0 0 6px rgba(134,163,140,.8); }

  /* mini wiki article used inside panes */
  .mini { padding: var(--space-lg); overflow: auto; }
  .mini h2 { font-family: var(--font-serif); font-size: 20px; font-weight: var(--fw-regular); margin-bottom: 2px; }
  .mini .src { font-family: var(--font-mono); font-size: 10px; color: var(--color-faint); margin-bottom: var(--space-md); }
  .claim { border-top: 1px solid var(--color-line); padding: 10px 0; font-size: 12.5px; color: var(--color-fg-secondary); display: flex; gap: 10px; }
  .claim b { color: var(--color-fg); font-weight: var(--fw-medium); min-width: 118px; font-size: 12px; }
  .claim .prov { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--color-faint); cursor: pointer; white-space: nowrap; }
  .claim .prov:hover { color: var(--color-accent); }
  .claim.disputed b { color: #C9A227; }

  /* ============ VARIANT A: dockview split panes ============ */
  .a-split { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--color-bg); }
  .pane-head { height: 34px; border-bottom: 1px solid var(--color-line); background: var(--color-panel-2); display: flex; align-items: center; gap: 9px; padding: 0 12px; flex: 0 0 auto; }
  .pane-head .nm { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; }
  .pane-head .x { margin-left: auto; color: var(--color-dim); cursor: pointer; font-family: var(--font-mono); }
  .pane-head .x:hover { color: var(--color-fg); }
  .pane.focused .pane-head { box-shadow: inset 0 2px 0 var(--color-accent); }
  .divider { width: 5px; cursor: col-resize; background: var(--color-line); flex: 0 0 auto; transition: background .15s ease; }
  .divider:hover, .divider.drag { background: var(--color-accent); }

  /* ============ VARIANT B: separate OS windows ============ */
  .desktop { position: relative; max-width: 1240px; margin: 20px auto; height: 660px; }
  .os-win { position: absolute; width: 58%; height: 540px; background: var(--color-bg); border: var(--window-border); border-radius: var(--window-radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.55); cursor: default; transition: box-shadow .15s ease; }
  .os-win .titlebar { cursor: grab; }
  .os-win.back { opacity: .92; }
  .os-win.front { z-index: 5; }
  .taskhint { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 8px; }
  .taskhint .chip { cursor: pointer; }
  .taskhint .chip:hover { color: var(--color-fg); border-color: var(--color-dim-hover); }

  /* ============ VARIANT C: corpus tabs + split toggle ============ */
  .c-tabs { height: 34px; border-bottom: 1px solid var(--color-line); background: var(--color-panel-2); display: flex; align-items: stretch; flex: 0 0 auto; }
  .c-tab { display: flex; align-items: center; gap: 8px; padding: 0 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; color: var(--color-dim); border-right: 1px solid var(--color-line); cursor: pointer; transition: all .12s ease; }
  .c-tab:hover { color: var(--color-fg-secondary); }
  .c-tab.active { color: var(--color-fg); background: var(--color-bg); box-shadow: inset 0 2px 0 var(--color-accent); }
  .c-actions { margin-left: auto; display: flex; align-items: center; padding-right: 10px; gap: 8px; }
  .c-actions button { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: 1px solid var(--color-line-2); color: var(--color-fg-secondary); padding: 4px 10px; cursor: pointer; transition: all .15s ease; }
  .c-actions button:hover { border-color: var(--color-dim-hover); color: var(--color-fg); }
  .c-actions button.on { color: var(--color-accent); border-color: rgba(134,163,140,.45); }
  .c-body { flex: 1; display: flex; min-height: 0; }
  .c-body .mini { flex: 1; }
  .c-body .mini.hidden { display: none; }
  .c-body .mini + .mini { border-left: 1px solid var(--color-line); }

  #toast { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--color-panel); border: 1px solid var(--color-accent); color: var(--color-fg); font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; padding: 10px 20px; opacity: 0; transition: all .2s ease; z-index: 10000; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" onclick="showVariant('a', this)">A: Split Panes (dockview) ★ Selected</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B: Separate OS Windows</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C: Corpus Tabs + Split Toggle</button>
</div>

<!-- ============ VARIANT A ============ -->
<div id="variant-a" class="variant active">
  <div class="window">
    <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">Titanic ⇆ Pluto</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
    <div class="a-split" id="a-split">
      <div class="pane focused" onclick="focusPane(this)">
        <div class="pane-head"><span class="dot on"></span><span class="nm">RMS Titanic</span><span class="chip warn">3 pending</span><span class="x" onclick="toast('Pane closes — Pluto takes full width')">×</span></div>
        <div class="mini" id="mini-a1"></div>
      </div>
      <div class="divider" id="a-div"></div>
      <div class="pane" onclick="focusPane(this)">
        <div class="pane-head"><span class="dot on"></span><span class="nm">Pluto</span><span class="chip warn">1 pending</span><span class="x" onclick="toast('Pane closes — Titanic takes full width')">×</span></div>
        <div class="mini" id="mini-a2"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ VARIANT B ============ -->
<div id="variant-b" class="variant">
  <div class="desktop">
    <div class="os-win back" style="top: 40px; left: 38%;" onclick="frontWin(this)">
      <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">Pluto</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
      <div class="mini" id="mini-b2"></div>
    </div>
    <div class="os-win front" style="top: 90px; left: 2%;" onclick="frontWin(this)">
      <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">RMS Titanic</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
      <div class="mini" id="mini-b1"></div>
    </div>
    <div class="taskhint">
      <span class="seclabel" style="align-self:center;">each corpus = its own OS window &amp; engine process — click a window to bring it forward · snap with Win+←/→</span>
    </div>
  </div>
</div>

<!-- ============ VARIANT C ============ -->
<div id="variant-c" class="variant">
  <div class="window">
    <div class="titlebar"><div class="logo"></div><span class="wordmark">Databasise</span><span class="crumb-dot">·</span><span class="crumb">Corpora</span><div class="winctl"><span>—</span><span>□</span><span>×</span></div></div>
    <div class="c-tabs">
      <div class="c-tab active" id="tab-t" onclick="cSwitch('t')"><span class="dot on"></span>RMS Titanic<span class="chip warn" style="font-size:9px;padding:1px 5px;">3</span></div>
      <div class="c-tab" id="tab-p" onclick="cSwitch('p')"><span class="dot on"></span>Pluto<span class="chip warn" style="font-size:9px;padding:1px 5px;">1</span></div>
      <div class="c-tab" onclick="toast('Palette opens to pick a corpus')" style="color:var(--color-accent);">+</div>
      <div class="c-actions"><button id="c-splitbtn" onclick="cToggleSplit()">⫿ Split</button></div>
    </div>
    <div class="c-body">
      <div class="mini" id="mini-c1"></div>
      <div class="mini hidden" id="mini-c2" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="sketch-tools" style="position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,0.7);color:white;padding:8px 12px;border-radius:8px;opacity:0.4;transition:opacity 0.2s;display:flex;gap:8px;align-items:center;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.4'">
  <span>002 side-by-side</span>
  <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'" style="background:#222;color:#fff;border:1px solid #444;font-size:11px;"><option value="default">default</option></select>
</div>

<script>
function showVariant(id, btn) {
  document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).classList.add('active');
  btn.classList.add('active');
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* mini wiki article content, rendered from real-ish fact shapes */
const ART = {
  titanic: { title: 'RMS Titanic', src: '318 canonical claims · head v14', rows: [
    ['Maiden voyage', 'Departed Southampton 10 April 1912', '3 sources'],
    ['Capacity', '2,435 passengers + 892 crew', '2 sources'],
    ['Lifeboats', '20 boats — capacity 1,178', '4 sources'],
    ['Departure time', 'DISPUTED — noon vs 12:15pm (2 sources disagree)', 'unresolved', true],
    ['Wreck depth', '3,784 m, located 1985', '2 sources'],
  ]},
  pluto: { title: 'Pluto', src: '96 canonical claims · head v6', rows: [
    ['Classification', 'Dwarf planet (IAU 2006 redefinition)', '3 sources'],
    ['Discovery', 'Clyde Tombaugh, 18 February 1930', '2 sources'],
    ['Moons', '5 known — Charon largest', '2 sources'],
    ['Diameter', 'DISPUTED — 2,376 km vs 2,370 km', 'unresolved', true],
    ['Orbit period', '247.9 years', '2 sources'],
  ]},
};
function renderMini(elId, key) {
  const a = ART[key];
  document.getElementById(elId).innerHTML =
    `<h2>${a.title}</h2><div class="src">${a.src}</div>` +
    a.rows.map(r => `<div class="claim${r[3] ? ' disputed' : ''}"><b>${r[0]}</b><span>${r[1]}</span><span class="prov" onclick="toast('Provenance popover: verbatim source spans')">${r[2]}</span></div>`).join('');
}
renderMini('mini-a1','titanic'); renderMini('mini-a2','pluto');
renderMini('mini-b1','titanic'); renderMini('mini-b2','pluto');
renderMini('mini-c1','titanic'); renderMini('mini-c2','pluto');

/* A: focus + draggable divider */
function focusPane(p) { p.closest('.a-split').querySelectorAll('.pane').forEach(x => x.classList.remove('focused')); p.classList.add('focused'); }
(() => {
  const div = document.getElementById('a-div'), split = document.getElementById('a-split');
  let drag = false;
  div.addEventListener('pointerdown', e => { drag = true; div.classList.add('drag'); div.setPointerCapture(e.pointerId); });
  div.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = split.getBoundingClientRect();
    const pct = Math.min(80, Math.max(20, ((e.clientX - r.left) / r.width) * 100));
    split.children[0].style.flex = `0 0 ${pct}%`;
  });
  div.addEventListener('pointerup', () => { drag = false; div.classList.remove('drag'); });
})();

/* B: window z-order */
function frontWin(w) {
  document.querySelectorAll('.os-win').forEach(x => { x.classList.remove('front'); x.classList.add('back'); });
  w.classList.remove('back'); w.classList.add('front');
}

/* C: tabs + split toggle */
let cSplit = false;
function cSwitch(k) {
  document.getElementById('tab-t').classList.toggle('active', k === 't');
  document.getElementById('tab-p').classList.toggle('active', k === 'p');
  if (!cSplit) {
    document.getElementById('mini-c1').style.display = k === 't' ? 'block' : 'none';
    document.getElementById('mini-c2').style.display = k === 'p' ? 'block' : 'none';
  }
}
function cToggleSplit() {
  cSplit = !cSplit;
  document.getElementById('c-splitbtn').classList.toggle('on', cSplit);
  document.getElementById('mini-c1').style.display = 'block';
  document.getElementById('mini-c2').style.display = cSplit ? 'block' : 'none';
  if (!cSplit) cSwitch(document.getElementById('tab-t').classList.contains('active') ? 't' : 'p');
}
</script>
</body>
</html>
